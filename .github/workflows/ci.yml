name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the Wave 9 eval harness (gates on pass_rate)."
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check sorakai tests scripts ui
          ruff format --check sorakai tests scripts ui

      - name: Typecheck (mypy --strict)
        run: mypy sorakai tests scripts ui

      - name: Run tests
        run: pytest --cov=sorakai --cov-report=term

      - name: OpenAPI specs match code
        run: python scripts/export_openapi.py --check --output openapi

  eval:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_eval }}
    env:
      RUN_EVAL: "1"
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: char
      VECTOR_STORE: memory
      HYBRID_RETRIEVER_ENABLED: "false"
      OTEL_ENABLED: "false"
      MLFLOW_CALLBACK_ENABLED: "false"
      LOG_FORMAT: console
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run eval harness (stub LLM smoke - gates only on context precision)
        # The stub LLM doesn't produce real answers so pass_rate is meaningless
        # here; we only assert the harness itself runs end-to-end. Operators
        # invoke `scripts/eval.py --target chain` against Ollama locally for the
        # quality gate.
        run: python scripts/eval.py --target chain --min-pass-rate 0 --min-context-precision 0 --quiet

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [gateway, ingest, rag]
    steps:
      - uses: actions/checkout@v6

      - name: Build image (${{ matrix.service }})
        run: |
          docker build \
            --build-arg SORAKAI_SERVICE=${{ matrix.service }} \
            -t sorakai-${{ matrix.service }}:ci .

      - name: Smoke health (${{ matrix.service }})
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          PORT=8000
          if [ "$SERVICE" = "ingest" ]; then PORT=8001; fi
          if [ "$SERVICE" = "rag" ]; then PORT=8002; fi
          CT_NAME="sorakai-smoke-${SERVICE}"
          docker run -d --name "$CT_NAME" -e PORT=$PORT -p ${PORT}:${PORT} sorakai-${SERVICE}:ci
          sleep 3
          curl -sf "http://127.0.0.1:${PORT}/health"
          curl -sf "http://127.0.0.1:${PORT}/openapi.bundled.json" | head -c 200
          docker rm -f "$CT_NAME"
