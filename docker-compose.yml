# Local stack: Redis + Ollama + MLflow + ingest, RAG, gateway.
# Override model: OLLAMA_MODEL=phi3:mini docker compose up --build
# MLflow UI: http://127.0.0.1:5000
# Wave 8 observability:
#   - Set OTEL_EXPORTER=otlp and OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317
#     to ship spans to the optional Jaeger service:
#       docker compose --profile otel up --build
#     then open Jaeger UI at http://127.0.0.1:16686.
#   - Set LOG_FORMAT=console for human-readable logs (default is JSON).
services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    network_mode: host
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s

  redis:
    image: redis:7-alpine
    network_mode: host

  # Wave 5/6: Qdrant vector DB. Wave 6 flips ingest + rag to ``VECTOR_STORE=qdrant``
  # by default; override per-service via env if you'd rather stay on the
  # Redis-backed in-process KnowledgeStore. Volume keeps the collection across restarts.
  qdrant:
    image: qdrant/qdrant:v1.18.0
    network_mode: host
    volumes:
      - qdrant_data:/qdrant/storage

  # Qdrant's image is intentionally tiny and does not consistently ship
  # curl/wget/bash. Keep the readiness probe in a purpose-built curl
  # sidecar instead of assuming tools inside the database image.
  qdrant-ready:
    image: curlimages/curl:8.11.1
    network_mode: host
    depends_on:
      qdrant:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fsS "http://127.0.0.1:6333/readyz" >/dev/null; do
          echo "Waiting for Qdrant..."
          sleep 2
        done
        echo "Qdrant ready."
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    network_mode: host
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  # One-shot: pull via Ollama HTTP API (CLI `ollama pull` may try to open a TUI without /dev/tty).
  ollama-model:
    image: curlimages/curl:8.11.1
    network_mode: host
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    # One list element = one argument to sh -c (avoids misparsing that runs bare `set` and dumps env).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model $$OLLAMA_MODEL ..."
        curl -sS -N -X POST "http://127.0.0.1:11434/api/pull" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$$OLLAMA_MODEL\"}"
        echo "Pulling embed model $$OLLAMA_EMBED_MODEL ..."
        curl -sS -N -X POST "http://127.0.0.1:11434/api/pull" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$$OLLAMA_EMBED_MODEL\"}"
        echo "Pull finished."
    restart: "no"

  # Wave 8: optional Jaeger collector + UI. Enable with
  #   docker compose --profile otel up --build
  # When started, every service auto-points its OTLP exporter at jaeger:4317.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    network_mode: host
    profiles: ["otel"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:14269/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SORAKAI_SERVICE: ingest
    network_mode: host
    environment:
      PORT: "8001"
      REDIS_URL: redis://127.0.0.1:6379/0
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-sorakai_kb}
      # Wave 8: ship spans to Jaeger when the otel profile is active.
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      redis:
        condition: service_started
      mlflow:
        condition: service_healthy
      qdrant-ready:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully

  rag:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SORAKAI_SERVICE: rag
    network_mode: host
    environment:
      PORT: "8002"
      REDIS_URL: redis://127.0.0.1:6379/0
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      # Fully local: Ollama for both chat and embeddings (no cloud providers).
      LLM_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-sorakai_kb}
      HYBRID_RETRIEVER_ENABLED: ${HYBRID_RETRIEVER_ENABLED:-true}
      # Wave 8 observability.
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      redis:
        condition: service_started
      mlflow:
        condition: service_healthy
      qdrant-ready:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SORAKAI_SERVICE: gateway
    network_mode: host
    environment:
      PORT: "8000"
      INGEST_SERVICE_URL: http://127.0.0.1:8001
      RAG_SERVICE_URL: http://127.0.0.1:8002
      # Wave 8 observability.
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Wave 10 gateway hardening. Leave GATEWAY_API_KEY blank to keep
      # the gateway open (the default for local stacks); set it to flip
      # bearer auth on without rebuilding the image. The rate limiter is
      # off by default; set RATE_LIMIT_PER_MINUTE>0 and (optionally)
      # REDIS_URL to share buckets across replicas.
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379/1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-10485760}
    depends_on:
      - ingest
      - rag

  # Wave 10: optional Streamlit chat UI. Enable with
  #   docker compose --profile ui up --build
  # Then open http://127.0.0.1:8501.
  ui:
    image: python:3.12-slim
    network_mode: host
    profiles: ["ui"]
    working_dir: /app
    environment:
      UI_GATEWAY_URL: ${UI_GATEWAY_URL:-http://127.0.0.1:8000}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org files.pythonhosted.org}
    volumes:
      - ./ui:/app/ui:ro
      - ./requirements-ui.txt:/app/requirements-ui.txt:ro
    # Install deps once on boot to keep the image cache-light; production
    # deployments should bake an image from a Dockerfile pinned to
    # requirements-ui.txt instead.
    command:
      - bash
      - -ceu
      - |
        pip install --quiet -r requirements-ui.txt
        exec streamlit run ui/streamlit_app.py --server.address 0.0.0.0
    depends_on:
      - gateway

volumes:
  ollama_data:
  mlflow_data:
  qdrant_data:
