# Local stack: Redis + Ollama + MLflow + ingest, RAG, gateway.
# Override model: OLLAMA_MODEL=phi3:mini docker compose up --build
# MLflow UI: http://127.0.0.1:5000
services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  # One-shot: pull via Ollama HTTP API (CLI `ollama pull` may try to open a TUI without /dev/tty).
  ollama-model:
    image: curlimages/curl:8.11.1
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    # One list element = one argument to sh -c (avoids misparsing that runs bare `set` and dumps env).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model $$OLLAMA_MODEL ..."
        curl -sS -N -X POST "http://ollama:11434/api/pull" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$$OLLAMA_MODEL\"}"
        echo "Pulling embed model $$OLLAMA_EMBED_MODEL ..."
        curl -sS -N -X POST "http://ollama:11434/api/pull" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$$OLLAMA_EMBED_MODEL\"}"
        echo "Pull finished."
    restart: "no"

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SORAKAI_SERVICE: ingest
    environment:
      PORT: "8001"
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBED_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_started
      mlflow:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully

  rag:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SORAKAI_SERVICE: rag
    environment:
      PORT: "8002"
      REDIS_URL: redis://redis:6379/0
      # Self-hosted LLM (Ollama OpenAI-compatible API)
      OPENAI_BASE_URL: http://ollama:11434/v1
      OPENAI_API_KEY: ollama
      OPENAI_CHAT_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBED_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_started
      mlflow:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SORAKAI_SERVICE: gateway
    environment:
      PORT: "8000"
      INGEST_SERVICE_URL: http://ingest:8001
      RAG_SERVICE_URL: http://rag:8002
    ports:
      - "8000:8000"
    depends_on:
      - ingest
      - rag

volumes:
  ollama_data:
  mlflow_data:
