openapi: 3.1.0
info:
  title: sorakAi Gateway
  description: BFF orchestrating ingest and RAG microservices
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /:
    get:
      tags:
      - ops
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
  /v1/documents:
    get:
      tags:
      - documents
      summary: Proxy List Documents
      operationId: proxy_list_documents_v1_documents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - documents
      summary: Proxy Ingest
      operationId: proxy_ingest_v1_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/documents/{doc_id}:
    delete:
      tags:
      - documents
      summary: Proxy Delete Document
      operationId: proxy_delete_document_v1_documents__doc_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          title: Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/query:
    post:
      tags:
      - rag
      summary: Proxy Query
      operationId: proxy_query_v1_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/agent:
    post:
      tags:
      - agent
      summary: Proxy Agent
      operationId: proxy_agent_v1_agent_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/query/stream:
    post:
      tags:
      - rag
      summary: Proxy Query Stream
      operationId: proxy_query_stream_v1_query_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/agent/stream:
    post:
      tags:
      - agent
      summary: Proxy Agent Stream
      operationId: proxy_agent_stream_v1_agent_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    AgentRequest:
      properties:
        question:
          type: string
          maxLength: 4000
          minLength: 1
          title: Question
        session_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Session Id
          description: If set, the agent loads the session's prior turns and persists
            the new pair.
        max_steps:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 1.0
          - type: 'null'
          title: Max Steps
          description: Per-request override of the AGENT_MAX_STEPS budget.
        use_chat_history:
          type: boolean
          title: Use Chat History
          description: If false, session_id is ignored (stateless turn).
          default: true
      type: object
      required:
      - question
      title: AgentRequest
      description: Input to ``POST /v1/agent`` (Wave 7).
      example:
        max_steps: 4
        question: summarise the README
        session_id: user-42
    AgentResponse:
      properties:
        answer:
          type: string
          title: Answer
        sources_used:
          type: integer
          minimum: 0.0
          title: Sources Used
          default: 0
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        route:
          type: string
          title: Route
          description: Final routing label (``kb`` or ``chitchat``).
        steps_used:
          type: integer
          minimum: 0.0
          title: Steps Used
        trace:
          items:
            type: string
          type: array
          title: Trace
          description: Ordered list of graph node visits for this invocation.
        tool_calls:
          items:
            $ref: '#/components/schemas/AgentToolCallEntry'
          type: array
          title: Tool Calls
      type: object
      required:
      - answer
      - route
      - steps_used
      title: AgentResponse
      description: Result of ``POST /v1/agent`` (Wave 7).
    AgentToolCallEntry:
      properties:
        name:
          type: string
          title: Name
        input:
          additionalProperties: true
          type: object
          title: Input
        output_summary:
          type: string
          title: Output Summary
          description: Tool output reduced to a string for transport (e.g. retriever
            returns '<n> docs', calc returns the number, web_search returns '<n> hits').
            Full payloads stay inside the agent state for tracing.
        duration_ms:
          type: number
          minimum: 0.0
          title: Duration Ms
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - name
      - output_summary
      - duration_ms
      title: AgentToolCallEntry
      description: One tool invocation, suitable for inclusion in :class:`AgentResponse`.
    DocumentDeleteResponse:
      properties:
        doc_id:
          type: string
          title: Doc Id
        removed_chunks:
          type: integer
          minimum: 0.0
          title: Removed Chunks
        message:
          type: string
          title: Message
      type: object
      required:
      - doc_id
      - removed_chunks
      - message
      title: DocumentDeleteResponse
      description: Result of ``DELETE /v1/documents/{doc_id}`` (Wave 4).
    DocumentIngestRequest:
      properties:
        filename:
          type: string
          maxLength: 512
          minLength: 1
          title: Filename
        content:
          type: string
          minLength: 1
          title: Content
        chunk_size:
          type: integer
          maximum: 10000.0
          minimum: 50.0
          title: Chunk Size
          default: 500
        chunk_overlap:
          type: integer
          maximum: 2000.0
          minimum: 0.0
          title: Chunk Overlap
          description: Number of characters each chunk overlaps with its neighbour.
            Must be strictly less than chunk_size; the splitter enforces that.
          default: 50
        mime_type:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Mime Type
          description: Optional MIME type hint (e.g. text/x-python, text/markdown).
            When omitted the splitter falls back to detecting the language from the
            filename suffix and finally to a plain recursive character split.
        document_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Document Id
          description: Stable id for this document; generated if omitted.
        replace_kb:
          type: boolean
          title: Replace Kb
          description: If true, remove all existing knowledge before adding this document.
          default: false
      type: object
      required:
      - filename
      - content
      title: DocumentIngestRequest
      example:
        chunk_overlap: 50
        chunk_size: 500
        content: "def foo():\n    return 42\n"
        filename: main.py
        mime_type: text/x-python
    DocumentIngestResponse:
      properties:
        message:
          type: string
          title: Message
        num_chunks:
          type: integer
          title: Num Chunks
        filename:
          type: string
          title: Filename
        document_id:
          type: string
          title: Document Id
          description: Id of the stored document (use for traceability)
      type: object
      required:
      - message
      - num_chunks
      - filename
      - document_id
      title: DocumentIngestResponse
    DocumentListResponse:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/DocumentSummaryResponse'
          type: array
          title: Documents
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Number of distinct documents in the KB
      type: object
      required:
      - documents
      - total
      title: DocumentListResponse
    DocumentSummaryResponse:
      properties:
        doc_id:
          type: string
          title: Doc Id
        filename:
          type: string
          title: Filename
        chunk_count:
          type: integer
          minimum: 0.0
          title: Chunk Count
        mime:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime
      type: object
      required:
      - doc_id
      - filename
      - chunk_count
      title: DocumentSummaryResponse
      description: One document row in :class:`DocumentListResponse` (Wave 4).
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
        service:
          type: string
          title: Service
      type: object
      required:
      - service
      title: HealthResponse
    QueryRequest:
      properties:
        question:
          type: string
          maxLength: 4000
          minLength: 1
          title: Question
        session_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Session Id
          description: If set, prior turns in this session are sent to the model and
            updated after each reply.
        top_k:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Top K
          description: Number of KB chunks to merge into context
          default: 5
        use_chat_history:
          type: boolean
          title: Use Chat History
          description: If false, session_id is ignored (stateless turn).
          default: true
      type: object
      required:
      - question
      title: QueryRequest
      example:
        question: What does foo return?
        session_id: user-42
        top_k: 5
    QueryResponse:
      properties:
        answer:
          type: string
          title: Answer
        context_preview:
          type: string
          title: Context Preview
          description: Short preview of merged retrieval context
        sources_used:
          type: integer
          title: Sources Used
          description: How many KB chunks were merged into context
          default: 0
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Echo when conversation state was used
      type: object
      required:
      - answer
      - context_preview
      title: QueryResponse
    ReadinessResponse:
      properties:
        ready:
          type: boolean
          title: Ready
        service:
          type: string
          title: Service
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - ready
      - service
      title: ReadinessResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
tags:
- name: documents
  description: Ingest pipeline
- name: rag
  description: Question answering
- name: ops
  description: Health and readiness
- name: compat
  description: Legacy /api/v1 -> /v1 redirects
