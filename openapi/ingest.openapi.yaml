openapi: 3.1.0
info:
  title: sorakAi Ingest
  description: Document chunking, embedding, and KB persistence
  version: 0.2.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v1/documents:
    get:
      tags:
      - documents
      summary: List Documents
      operationId: list_documents_v1_documents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
    post:
      tags:
      - documents
      summary: Ingest Document
      operationId: ingest_document_v1_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents/{doc_id}:
    delete:
      tags:
      - documents
      summary: Delete Document
      operationId: delete_document_v1_documents__doc_id__delete
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          title: Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DocumentDeleteResponse:
      properties:
        doc_id:
          type: string
          title: Doc Id
        removed_chunks:
          type: integer
          minimum: 0.0
          title: Removed Chunks
        message:
          type: string
          title: Message
      type: object
      required:
      - doc_id
      - removed_chunks
      - message
      title: DocumentDeleteResponse
      description: Result of ``DELETE /v1/documents/{doc_id}`` (Wave 4).
    DocumentIngestRequest:
      properties:
        filename:
          type: string
          maxLength: 512
          minLength: 1
          title: Filename
        content:
          type: string
          minLength: 1
          title: Content
        chunk_size:
          type: integer
          maximum: 10000.0
          minimum: 50.0
          title: Chunk Size
          default: 500
        chunk_overlap:
          type: integer
          maximum: 2000.0
          minimum: 0.0
          title: Chunk Overlap
          description: Number of characters each chunk overlaps with its neighbour.
            Must be strictly less than chunk_size; the splitter enforces that.
          default: 50
        mime_type:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Mime Type
          description: Optional MIME type hint (e.g. text/x-python, text/markdown).
            When omitted the splitter falls back to detecting the language from the
            filename suffix and finally to a plain recursive character split.
        document_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Document Id
          description: Stable id for this document; generated if omitted.
        replace_kb:
          type: boolean
          title: Replace Kb
          description: If true, remove all existing knowledge before adding this document.
          default: false
      type: object
      required:
      - filename
      - content
      title: DocumentIngestRequest
      example:
        chunk_overlap: 50
        chunk_size: 500
        content: "def foo():\n    return 42\n"
        filename: main.py
        mime_type: text/x-python
    DocumentIngestResponse:
      properties:
        message:
          type: string
          title: Message
        num_chunks:
          type: integer
          title: Num Chunks
        filename:
          type: string
          title: Filename
        document_id:
          type: string
          title: Document Id
          description: Id of the stored document (use for traceability)
      type: object
      required:
      - message
      - num_chunks
      - filename
      - document_id
      title: DocumentIngestResponse
    DocumentListResponse:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/DocumentSummaryResponse'
          type: array
          title: Documents
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Number of distinct documents in the KB
      type: object
      required:
      - documents
      - total
      title: DocumentListResponse
    DocumentSummaryResponse:
      properties:
        doc_id:
          type: string
          title: Doc Id
        filename:
          type: string
          title: Filename
        chunk_count:
          type: integer
          minimum: 0.0
          title: Chunk Count
        mime:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime
      type: object
      required:
      - doc_id
      - filename
      - chunk_count
      title: DocumentSummaryResponse
      description: One document row in :class:`DocumentListResponse` (Wave 4).
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
        service:
          type: string
          title: Service
      type: object
      required:
      - service
      title: HealthResponse
    ReadinessResponse:
      properties:
        ready:
          type: boolean
          title: Ready
        service:
          type: string
          title: Service
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - ready
      - service
      title: ReadinessResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
